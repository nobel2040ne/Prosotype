# auto-CWI configuration. All mapping thresholds/ranges live here, not in code.
# Values follow the official "Caption with Intention" Design System V1.0 (2025.1):
# https://download.captionwithintention.org/Caption-With-Intention_Design-System_V1.0.pdf

# Speaker -> color, assigned deterministically by order of first appearance.
# CI Main character colors (design system 2.1.1), in wheel order #01..#06.
palette:
  - "#E5E517"   # CI Main Yellow
  - "#17E517"   # CI Main Green
  - "#17E5E5"   # CI Main Blue
  - "#E517E5"   # CI Main Pink
  - "#E51717"   # CI Main Red
  - "#E58017"   # CI Main Orange
# CI Supporting colors (2.1.2), used for speakers 7+.
palette_support:
  - "#E85C2E"
  - "#EBC247"
  - "#C2EB47"
  - "#82ED5E"
  - "#47EB70"
  - "#5EEDC9"
  - "#47C2EB"
  - "#5E82ED"
  - "#8C6BED"
  - "#CC6BED"
  - "#EB47C2"
  - "#ED5E82"

# Light-stage speaker colors. A DOCUMENTED DEVIATION from 2.1.1/2.1.2, used only
# by the Next studio's optional light stage (which itself deviates from 2.4.1's
# 90% black captions box). The CI palette above is built for that black box and
# is unreadable on a light surface -- measured against the light caption plate
# #FAFAF8, CI Yellow is 1.19:1, CI Green 1.52:1, CI Blue 1.39:1. Each entry keeps
# its CI hue and darkens only its value until it clears WCAG AA 4.5:1, so speaker
# identity still reads as yellow/green/blue. The dark stage renders the exact CI
# values above and remains one toggle away.
palette_light:
  - "#76760C"   # from CI Main Yellow #E5E517   4.60:1
  - "#0D840D"   # from CI Main Green  #17E517   4.65:1
  - "#0D7F7F"   # from CI Main Blue   #17E5E5   4.61:1
  - "#C714C7"   # from CI Main Pink   #E517E5   4.62:1
  - "#E11717"   # from CI Main Red    #E51717   4.63:1
  - "#AA5F11"   # from CI Main Orange #E58017   4.61:1
# Supporting colors (2.1.2) for speakers 7+, same derivation.
palette_support_light:
  - "#C14D26"   # from #E85C2E   4.61:1
  - "#876F29"   # from #EBC247   4.63:1
  - "#657A25"   # from #C2EB47   4.60:1
  - "#467F33"   # from #82ED5E   4.63:1
  - "#27823E"   # from #47EB70   4.62:1
  - "#327E6B"   # from #5EEDC9   4.64:1
  - "#2D7A94"   # from #47C2EB   4.65:1
  - "#4F6DC7"   # from #5E82ED   4.63:1
  - "#7B5ED1"   # from #8C6BED   4.60:1
  - "#9D52B6"   # from #CC6BED   4.66:1
  - "#C03A9F"   # from #EB47C2   4.62:1
  - "#BC4B67"   # from #ED5E82   4.63:1

# The Captions Box (2.4.1): black at 90% opacity, hugging each caption line,
# overlaid on the video inside the work area (lower 20% of the frame, 2.4.3).
caption_box:
  color: "#000000"
  opacity: 0.9
  bottom_margin_pct: 7.5      # bottom safety margin, % of video height
  max_lines: 2

# The Read-Ahead Type (2.2.1): each line appears whole in white at 90% opacity;
# words flip to the speaker color at their exact spoken onset (2.2.2).
read_ahead:
  color: "#FFFFFF"
  opacity: 0.9
  # 2.2.1's white is specified against 2.4.1's 90%-black captions box, and the
  # light stage deliberately has no box. MEASURED against that stage's #FAFAF8
  # surface, white read-ahead is 1.05:1 -- not weak, invisible. This is the same
  # deviation, and the same remedy, as palette_light: keep the SEMANTIC (the
  # read-ahead is neutral and uncoloured, so colour still means "spoken") and
  # change only the value until it is legible. #6E6E73 measures 4.85:1 there,
  # and stays quieter than the saturated palette_light speaker hues, so the
  # colour turn is still the thing that reads as the change.
  color_light: "#6E6E73"

# What reaches the stage, and for how long.
#
# CWI read-ahead assumes the line is KNOWN before it is spoken: in film the
# caption is authored in advance, so it never revises, and that stability is
# what lets a viewer read ahead at their own pace. Live ASR is guessing and
# correcting instead. Measured on one 48-word utterance, showing the 160 ms
# draft as read-ahead rewrote the stage 55 times and deleted words 16 times.
# Text that will not hold still is not read-ahead.
#
# RESOLVED 2026-08-01 by `read_ahead_delay_s` below, and the resolution is not
# "show the draft anyway". The playhead trails the acoustic clock, so the text
# on screen ahead of the colour is text the recognizer has ALREADY committed --
# stable by the time a reader reaches it, revisable only while it is still
# white. Both halves of the problem above are satisfied at once.
#
#   sentence  - turn-taking: nothing shows until a whole utterance is finalized,
#               then the complete line appears at once, settled, no per-word
#               motion. Highest latency to first word, but the calmest to read —
#               each speaker's turn lands as one stable line.
#   stable    - only words the accurate stream has committed. They appear in
#               spoken order, one at a time, and never change afterwards.
#               ~1.8 s median on the bundled sample.
#   fast      - stable's settled words PLUS the accurate stream's own
#               not-yet-committed tail as white read-ahead (~0.7 s median on
#               the bundled sample, revises rarely).
#   readahead - also load/render the 160 ms draft in white; earliest text, but
#               the stage visibly rewrites itself and the extra model costs CPU.
display:
  # The static Next.js export is the product UI. When `web/out` is absent,
  # live falls back to the self-contained diagnostics renderer. A built studio
  # keeps that renderer available at /legacy.
  frontend: next
  # `fast` is the normal live mode: the accurate stream's current white tail
  # appears before it is locked, then settles in place. The lower-latency draft
  # model is loaded only for explicit `readahead` mode; running it while hiding
  # all of its words wasted enough CPU to make the accurate captions less live.
  mode: fast
  # Stacked live transcript: new text-hugging boxes grow upward from the bottom.
  align: left             # left | center
  # overflow: lines accumulate and are pushed off the top only when the stage
  # is full (terminal-style). linger: fade after line_linger_s, max_lines boxes.
  # The live system intentionally uses the stacked transcript view.
  retention: overflow
  # A quiet, non-text voice indicator follows the active speaker's line. Its
  # outer radius is true captured volume, the inner bead is real-time F0, and
  # the soft inner oval reflects periodicity/spectral brightness. Keeping these
  # continuous signals outside the glyphs preserves caption legibility.
  intent_circle: true
  intent_circle_size_pct: 2.3
  intent_circle_volume_db: [-60, -15]
  intent_circle_pitch_hz: [80, 250]
  intent_circle_brightness_hz: [500, 3500]
  intent_circle_smoothing: 0.24
  # The diagnostics/legacy box uses an eight-word visual block. Transcript keeps
  # complete semantic turns.
  max_words: 8
  studio_paragraph_word_limit: 0  # 0 = unlimited; split only on speaker change
  # FALLBACK ONLY since 2026-07-30. Audience Stage is a rolling stack whose depth
  # is MEASURED in the browser (`useStackCapacity`): available stage height over a
  # real row's height, because the stage is a flexible box and the caption size
  # follows both it and the Caption scale slider. As a constant this was six, and
  # measured at 1440x900 six rows filled 52% of the stage -- so the seventh row
  # evicted the first while half the surface sat empty and the stack visibly
  # scrolled for no reason. The same window now holds nine. This value is what the
  # studio uses before it has measured anything, and the floor of the clamp.
  # Completed rows stay fixed while only the newest row grows; older text stays in
  # Transcript.
  studio_stage_paragraph_history: 6
  # THE MAXIMUM words in a Stage row, not the row width. Words-per-row and the
  # caption type size are one decision -- rows do not wrap, so N words set a hard
  # ceiling on the type -- and `planStageLayout` now makes it as one calculation
  # from the measured stage. Holding N at six handed the caption size to the
  # window's aspect ratio: measured, 1440x900 gave 47px type on an 86%-full stage
  # while 862x998 gave 23.6px on a stage that was 40% EMPTY, because six words
  # still had to cross a 538px stage. The narrow window now picks three words and
  # 44px.
  # Six is still the ceiling: at the shipped type size eight words landed exactly
  # on the wrap boundary, so a verifier respelling that changed a word's width
  # flipped the row between one and two visual lines and the stack below jumped.
  studio_stack_words_per_block: 6
  # The floor. Below three, a row stops reading as a phrase.
  studio_stack_words_min: 3
  # Rows the stack must be able to show before a shorter row (and therefore
  # larger type) is preferred. This is the term that keeps a WIDE stage on six
  # words: at 10 rows, 1440x900 keeps six and 862x998 drops to three. Lower it
  # and wide stages start using three-word rows at the height ceiling, which
  # wastes their width; raise it and narrow stages go back to small type.
  studio_stack_min_rows: 10
  # Streaming recognizers often release several words in one decoder batch.
  # Paint them in spoken order instead of popping the whole batch at once. The
  # gap follows the words' acoustic spacing inside a batch, bounded so fast
  # speech stays legible and a pause does not create a second long delay.
  # Deadlines stay anchored to the original batch schedule: waiting behind the
  # active motions never restarts the full gap. A current word waits hidden for
  # a motion slot; it is never painted motionless and never animated after it
  # has already appeared.
  #
  # THREE, raised from two on 2026-07-30 because the caption visibly lagged.
  # This is a THROUGHPUT CEILING, not a tuning preference: N slots at the
  # 320 ms smoothness floor can display at most N/0.32 words/s. Two slots gave
  # 6.25 w/s against conversational English's measured ~6.2 w/s (160 ms median
  # onset spacing), so the queue sat exactly on its limit and the presentation
  # backlog grew to a measured 3.2 s single-pass / 7.6 s looped. Three slots
  # give 9.4 w/s and drain it. Do NOT instead lower word_motion_min_duration_s:
  # below 320 ms the motion itself stops reading as motion.
  max_simultaneous_reveals: 3
  word_reveal_gap_s: 0.14
  word_reveal_gap_min_s: 0.08
  word_reveal_gap_max_s: 0.26
  word_reveal_timing_strength: 0.75
  word_reveal_catchup_gap_s: 0.06
  # ---------------------------------------------------------------------------
  # THE READ-AHEAD DELAY (CWI 2.2.1). THIS IS WHAT MAKES THE STUDIO A CWI
  # RENDERER RATHER THAN A WORD-POP ANIMATION.
  #
  # The design system is built on the line existing in white BEFORE it is
  # spoken. A live recognizer cannot produce text early, so for a long time the
  # studio painted each word on arrival and had no read-ahead at all -- which
  # also meant no stable text to read, and a caption invariant enforced by a
  # thicket of guards instead of by construction.
  #
  # Presenting from a playhead that trails the acoustic clock inverts that. ASR
  # delivers a word about 1.1 s after it is spoken (the 1120 ms accurate
  # stream); colouring only up to `now - 2.5 s` leaves ~1.4 s of recognized,
  # verified, still-white text on screen ahead of the colour at all times.
  #
  # Consequences, all of them good:
  #   - 2.2.1 read-ahead, 2.2.2 onset colour and the 2.2.3 pop all become pure
  #     functions of the recording's own timing, scheduled by the browser as one
  #     `animation-delay`. The reveal queue, its concurrency slots, catch-up
  #     policy, adaptive clock and backlog ceiling are all gone.
  #   - text may be revised only AHEAD of the playhead; once a word turns
  #     colour it is frozen. The caption invariant is now structural.
  #
  # MEASURED on the bundled English sample (scripts/studio_probe.py, 40
  # samples each), because the delay does NOT convert into read-ahead one for
  # one -- `fast` mode holds a word back until the following one is stable, so
  # the window is only partly filled with text:
  #
  #     delay    words past the playhead (median / max)
  #     2.5 s    1 / 6
  #     4.0 s    2 / 8
  #     5.5 s    6 / 16
  #
  # LOWERED 2026-08-01, 2.5 -> 1.2, at the user's direction: "motion should be
  # real-time". THE DELAY *IS* THE LAG. A word's colour turn and pop happen at
  # `onset + delay`, so 2.5 s put the cue two and a half seconds after the sound
  # in the room -- and, measured on the bundled clip, durable speaker
  # attribution arrives at a median 4.48 s, so the word popped into NEUTRAL and
  # only took its speaker colour ~2 s later. The visually meaningful moment
  # landed after attribution, which is exactly what that looks like.
  # Word TEXT, by contrast, is available at a median 0.62 s. 1.2 s clears that
  # comfortably, so most words still animate rather than arriving already past
  # their own onset, while the cue lands close enough to the speech to read as
  # synchronized. Read-ahead is thin at this setting, and that is the trade:
  # the delay buys read-ahead and spends sync, one for one.
  # Raise it toward 5.5 s for a lecture or a recorded screening, where lag costs
  # nothing and a fuller white line is worth more.
  # Below the recognizer's own delivery latency it buys nothing at all, and
  # `lateWords` in window.__cwiStudio.report() climbs because words arrive
  # after their own onset has already passed.
  read_ahead_delay_s: 1.2
  # CWI 2.3 IS PER CHARACTER, and this is how many readings of the word's own
  # audio the client gets to shape them with. The design system's illustrations
  # are unambiguous: p.34 sets "Put that coffee dOWn!" under its own waveform
  # with the O and W huge and the d and n! small; p.38 does the same to weight
  # across "neeeeeeeeed"; p.40 ramps a whole sentence from black to hairline.
  # One median per word cannot express any of that.
  # Eight samples resolve a syllable without bloating the SSE payload, and the
  # cost is near zero -- the pitch analysis already runs over the span and was
  # simply discarding the contour.
  intonation_envelope_samples: 8
  # The reference motion breathes rather than jabs. Normal words get a 520 ms
  # zero-slope rise/return; a longer acoustic word may stretch toward 720 ms.
  # The two-word active cap still prevents overlap from becoming visual noise.
  word_motion_duration_s: 0.52
  word_motion_max_duration_s: 0.72
  word_motion_span_stretch: 0.42
  # Fixed 520–720 ms motion has a two-slot throughput ceiling. Above roughly
  # 3.8 words/s, that ceiling otherwise becomes a minute-long presentation
  # buffer. The studio measures acoustic word cadence and reduces only the
  # clocks required to sustain it. 320 ms is the smoothness floor; backlog
  # pressure adds bounded headroom until the caption frontier is within 600 ms.
  word_motion_min_duration_s: 0.32
  word_motion_backlog_target_s: 0.60
  # Above this much acoustic backlog a word is HISTORY, not live speech: it is
  # revealed settled and un-paced instead of animating. Cold start is why this
  # exists -- model loading takes ~7.6 s while the source keeps running, so the
  # first browser to attach inherited a MEASURED 12.7 s / 28-word queue and
  # spent ~7 s racing through it, arriving seconds after the sound. That is what
  # read as lagging and choppy. The adaptive clock cannot fix it: it can shorten
  # a motion but not make one free. Set to 0 to disable and animate everything.
  word_motion_backlog_ceiling_s: 1.20
  word_motion_rate_headroom: 0.90
  word_motion_catchup_scale: 0.82
  # A speculative first phone ("H" in a sustained "Hello") must remain alive
  # long enough for the authoritative spelling to revise that same node.
  onset_motion_duration_s: 0.68
  # Normalize decoder word lengths onto one compact visual word. Without this,
  # a long ASR span compressed its whole intonation attack into ~25 ms.
  word_motion_source_span_s: 0.14
  word_reveal_fade_s: 0.22
  line_break_gap_s: 2.0   # silence that forces a new line
  line_linger_s: 9.0      # linger retention only: how long a line stays
  # sentence mode: gap between successive turns as they are revealed, so a
  # finalized utterance reads as a flowing exchange rather than a block dump.
  sentence_stagger_s: 0.7
  # Once a word's one-time motion window ends, its geometry and font axes are
  # SETTLED forever. Speaker colour may arrive during that window without
  # changing its clock; a later colour decision writes colour only.
  # `corrections` may still write a late respelling (a misheard word is worth
  # fixing); `strict` freezes the text too.
  stability: corrections
  # window.__cwiChurn.report() in the browser console: post-paint mutations
  # per settled word. Should be ~0 except colour<=1 and genuine corrections.
  debug_churn: false
  # Opt-in per-second renderer diagnostics. The report is available at
  # window.__cwiRenderDiag.report(); add ?renderdiag=1 to show it in the stage.
  # No metrics leave the local browser.
  debug_render: false
  diagnostic_interval_s: 1.0
  # Hard cap for the per-word animation-frame queue. Ordinary depth is tiny;
  # the cap prevents an abandoned/reconnecting tab from retaining indefinitely.
  render_queue_limit: 512
# Guiding The Eye With Motion. PDF §2.2.3 supplies the full +15% type-size pop
# and 25% elevation used by CC. The Next studio uses those same constants in
# `motion.live_sync.studio`; changing the legacy live values never changes CC.
# Late colour decisions are colour-only and cannot start geometry; a decision
# arriving during real-time motion waits for geometry rest.
# The official After Effects template is also a calm reference; its inventory is:
#     16x ADBE Text Position 3D, 8x ADBE Text Fill Color
# There is NO scale/size/tracking/rotation/opacity animator anywhere in it.
# Live paints motion on a temporary overlaid glyph. The normal layout sizer is
# never rewritten, and all §2.3 axes return to normal with the motion.
#
# The template drives color and lift from one index-unit Range Selector, one
# word wide, with Ease High/Low set - so neighbouring words are partially
# lifted and the effect reads as a wave travelling along the line. A second
# "Antecipate" animator runs the same sweep shifted 1-4 frames earlier
# (~33-133 ms at 30 fps, easeOut), so motion LEADS the color turn.
motion:
  elevation_em: 0.25          # -amp in the template's Position 3D expression
  # "Antecipate" lead. The template states it exactly: the animator's own
  # expression opens with `antecipation = framesToTime(1)` and shifts its
  # marker window back by that — ONE frame at 30 fps, not the 110 ms guessed
  # from "1..4 frames".
  anticipation_ms: 33
  # Partial lift on the NEXT, not-yet-spoken word (the template's Ease High/Low
  # travelling wave). 0 = only the word being spoken moves.
  #
  # The template animates a finished line that the viewer watches play through.
  # Live, words accumulate and stay on screen, so displacing a settled word
  # disturbs text somebody is still reading — the opposite of what read-ahead
  # (2.2.1) is for. Off by default; raise it to restore the wave.
  neighbor_bleed: 0.0
  color_turn_ms: 90           # color eases with the lift, never a hard cut
  duration_s: 0.56
  min_duration_s: 0.42
  max_duration_s: 0.90
  easing: cubic-bezier(0.22, 0.78, 0.24, 1)
  # Syllable Variation (2.2.4): for drawn-out delivery ("un-be-lie-va-ble") the
  # colour turn may advance THROUGH the word instead of flipping it at once.
  # The word is already fully visible in white first — this is a colour wipe,
  # never a typewriter reveal, because progressive *appearance* would destroy
  # the read-ahead that 2.2.1 exists to provide.
  #
  # The transducer quantizes timestamps to its encoder frame, so ordinary short
  # words emit every sub-word piece on one frame and have no internal timing to
  # animate. Gating on duration keeps the effect where the design system puts
  # it and where the data actually supports it.
  syllable_fill:
    enabled: true
    min_duration_s: 0.32     # below this, a word is not "drawn out"
    min_syllables: 2         # needs >=2 distinct sub-word onsets

  # --- Live and `cc` share ONE pure motion engine
  # (autocwi/cwi_motion_core.js), but intentionally use SEPARATE presentation
  # values. CC keeps the stronger reference values in `closed_caption:` below.
  # A stacked live transcript uses the calmer `live_sync` values here because
  # older words remain on screen and must not move when the next word arrives.
  # Live re-bases the shared math onto a one-time first-paint clock:
  #   * TRANSIENT prosody — measured loudness/pitch vary size/weight only while
  #     a word moves. Every completed word returns to the same normal
  #     5% / Regular 400 / width 100 typography.
  #   * PER-CHARACTER synchronization — an upward-only, neighbour-blended
  #     lift/pop ribbon crosses the already-visible letters. This is separate
  #     from the colour decision and is not a typewriter reveal.
  #   * A smaller live-only word pop/elevation, in phase with first paint.
  #     Neighbour-push is off: only the new word may move.
  #   * THE CAPTION INVARIANT holds: a word animates ONCE; a settled word
  #     computes to rest and is cache-skipped; later colour/verification recolours
  #     in place, never re-pops.
  # These values affect LIVE ONLY. Changing them never changes `autocwi cc`.
  live_sync:
    enabled: true
    # These are the LEGACY diagnostics renderer's values. The Next studio reads
    # the `studio:` sub-block further down, which overrides any of them -- the
    # two presentations deliberately do not share tuning.
    sync_pop: 0.10
    sync_elevation_em: 0.20
    rise_s: 0.18              # slower attack; avoids the angry jab
    peak_s: 0.14              # calm, readable emphasis
    fall_s: 0.34              # longer release back to rest
    # Font variation exists only inside the motion window. Afterwards every
    # word returns to normal 5% / Regular 400 / width 100 typography. Lowering
    # the live-only effect deadband lets more measured delivery differences
    # appear without leaving any persistent font effect in the transcript.
    # Voice-shaped excursion while the word is active. Volume controls scale;
    # pitch controls weight and width. Bounds keep the stacked transcript
    # readable while preserving clearly different whisper/normal/emphasis cues.
    size_response: 0.78
    prosody_strength: 0.78
    min_emphasis_scale: 0.78
    max_emphasis_scale: 1.34
    pitch_response: 1.0
    width_response: 0.75
    font_weight_strength: 1.70
    # Active words may travel beyond the calm transcript's 280..500 band.
    # This range is transient only; the word always resolves to Regular 400.
    active_weight_range: [180, 700]
    font_width_strength: 0.90
    # Do not drive every type axis with one generic pulse. Fractions are over
    # the bounded per-word display clock: pitch/weight articulates first,
    # loudness/size breathes through the middle, and resonance/width follows
    # later. Every curve has zero velocity at its endpoints and reaches exact
    # normal type before the word leaves its one allowed motion window.
    size_attack_fraction: 0.42
    size_hold_fraction: 0.62
    weight_attack_fraction: 0.30
    weight_hold_fraction: 0.48
    weight_release_fraction: 0.90
    width_attack_fraction: 0.50
    width_hold_fraction: 0.68
    width_release_fraction: 0.96
    # Acoustic word duration already stretches the complete 520–720 ms clock.
    # This additional continuous delay makes a drawn-out delivery develop its
    # type curves more languidly instead of merely replaying the fast shape for
    # longer. It affects live only; authored CC timing remains untouched.
    slow_delivery_curve_delay: 0.06
    # Loud words rise farther; quiet words stay closer to the baseline. This
    # changes the trajectory, not merely the scale, so delivery profiles do not
    # all read as the same motion at different sizes.
    lift_base_gain: 0.82
    lift_prosody_gain: 2.8
    lift_min_gain: 0.28
    lift_max_gain: 1.40
    emphasis_deadband: 0.02
    # REMOVED 2026-07-31: `voice_sensitivity_gamma` (0.62) and
    # `delivery_expressiveness_floor` (0.34). The gamma re-centred each word on
    # the speaker's running median, destroying 2.3.5's absolute size baseline
    # and 2.3.8's 160-200 Hz neutral band. The motion crest now uses the PDF's
    # absolute anchors directly; see `live_sync.studio` below and
    # `web/src/lib/caption-motion.ts`.
    # WEBSITE SYNCHRONIZATION LAYER. `intonation.mov` changes a stressed word
    # uniformly; `synchronization.mov` hands a *continuous* motion boundary
    # through the word. Adjacent samples are blended into one ribbon: isolated
    # up/down letter teeth looked like ziggle and were not in the reference.
    character_wave_enabled: true
    # Strong enough to read as the synchronization reference's travelling
    # alphabet ribbon, while staying upward-only and neighbour-smoothed.
    # LIFT is calibrated and should stay. Measured like-for-like with the pixel
    # method against docs/reference/synchronization.mov, the per-letter baseline
    # spread inside one row is median 8.8% of glyph height on the reference and
    # 11.9% here -- already at or slightly above it, once the wave was actually
    # allowed to travel (see `character_wave_overlap`).
    character_wave_lift_em: 0.085
    # POP is the channel still under the reference. The fitted per-character size
    # on the recordings is 1.13; 1.03 was barely a differentiation at all between
    # neighbouring letters. 0.055 roughly doubles it while staying clearly
    # subordinate to the word-level 15% cue that CWI 2.2.3 actually specifies --
    # the character ribbon must stay a hand-off, not a second word-level pop.
    character_wave_pop: 0.05
    # How many letters of a word are in flight at once. This is what makes the
    # alphabet hand-off a WAVE rather than a synchronous word-level pulse: the
    # per-letter step and bump are both derived from it
    # (`characterWaveTiming`), so the hand-off always finishes exactly on the
    # word's own clock however long the word is.
    # The old model had a hard 18ms step cap that fired for every word up to 13
    # characters, and ran each letter for the FULL word clock -- measured, the
    # letters of a word differed by 0.017em, i.e. 0.8px at 47px type. At 3.0 a
    # 520ms word steps 87ms on a four-letter word and 46ms on a nine-letter one,
    # inside the 53-110ms letter spacing measured on the reference recording.
    character_wave_overlap: 4.5
    character_wave_crouch_em: 0.0
    character_wave_lead_s: 0.18
    character_wave_peak_s: 0.18
    character_wave_fall_s: 0.48
    character_wave_spatial_smoothing: 0.72
    # Virtual spacing between character turns. The complete virtual curve is
    # mapped into each word's bounded 520–720 ms display window, so longer
    # words get a readable travelling wave instead of a 100-ms alphabet flash.
    character_wave_step_s: 0.18
    character_wave_max_span_s: 2.20
    # Live speech is commonly faster than authored CC. Lengthening every word
    # would make the caption queue fall behind, so a minimum-duration word
    # travels only 58% of the full geometry distance. The gain eases to 100%
    # for slower/drawn-out words. Timing stays real-time; visual velocity drops.
    fast_speech_motion_gain: 0.58
    # Delivery dynamics add distinct paths without adding persistent styles:
    # contour changes the release direction, force changes lift, flow holds the
    # crest, attack changes the onset displacement, and texture adds a soft
    # resonance halo. None of these values affect authored `autocwi cc`.
    delivery_enabled: true
    delivery_contour_lift_em: 0.055
    delivery_force_lift_em: 0.045
    delivery_attack_drop_em: 0.025
    delivery_flow_hold_em: 0.035
    # Extra lift from measured intonation scale, composed on top of the
    # constant 0.20 em synchronization cue. The base cue itself is never
    # attenuated by an emotion/delivery threshold.
    delivery_intonation_lift_gain: 0.35
    # Even a conservatively classified `steady` word retains audible
    # loudness/pitch variation in its transient size/weight/width axes.
    # This does not lower the semantic delivery-profile thresholds.
    delivery_axis_gain_floor: 0.50
    # WEIGHT IS THE CHANNEL THAT WAS DOING THE LEAST, MEASURED (2026-07-30).
    # Sampled over 92 words of the bundled sample, `--active-weight` deviated
    # from Regular 400 by a median of 102 units and a MAXIMUM of 170 -- on the
    # Roboto Flex wght axis 400->500 is Regular->Medium, which at caption size is
    # very nearly invisible. Two things held it down: the rendered band was
    # 180..700 (so pitch had to reach 80/250 Hz to spend it), and the shared
    # `delivery_axis_gain_floor` halved what was left.
    # `weight_range` is the transient band a word may travel through -- it must
    # still LAND on exactly 400, which is what the keyframes enforce. 100..900 is
    # the full usable axis of both caption faces (Roboto Flex goes to 1000; Noto
    # Sans KR stops at 900), so this is the widest honest setting.
    # `weight_gain` multiplies the weight channel ONLY. It does not touch the
    # constant §2.2.3 synchronization cue, size, width, or lift.
    weight_range: [100, 900]
    weight_gain: 1.75
    # Slow flow may use more of the existing window but never exceed the global
    # 720 ms cap; the next fresh word remains hidden until a slot opens.
    delivery_flow_duration_ms: 90
    delivery_texture_glow_px: 6
    delivery_min_confidence: 0.38
    # =====================================================================
    # THE NEXT STUDIO'S MOTION, STRICTLY FROM THE DESIGN SYSTEM PDF.
    # (2026-07-31. Overrides any key above; the legacy diagnostics renderer keeps
    # the values it was tuned against.)
    #
    # `docs/cwi-design-system-v1.0.pdf` pp.26-41 describes THREE things:
    #   2.2.2  the word turns the speaker colour at its spoken onset;
    #   2.2.3  as it turns, it undergoes "a 15% increase in type size before
    #          returning to its original size" -- the diagram labels the rise
    #          "25% elevation", and its inset shows the popped word both LARGER
    #          and RAISED off its neighbours' baseline;
    #   2.3    volume -> type SIZE, pitch -> type WEIGHT, harmonics -> type
    #          WIDTH during the word's one live interpretation window.
    #
    # The live lifecycle is explicit: normal -> voice-shaped crest + the fixed
    # synchronization cue -> normal. Normal 5% / Regular 400 / width 100 type
    # owns layout; an overlaid glyph carries both transient layers, so no
    # JavaScript width measurement or retained animation style is required.
    # =====================================================================
    studio:
      # 2.2.3, verbatim: "a 15% increase in type size before returning to its
      # original size". THE WORD GROWS FROM ITS BASELINE; IT DOES NOT HOP.
      # There was a `sync_elevation_em: 0.25` next to this, on the reading that
      # the diagram's "25% elevation" was a second, vertical channel. Overlaying
      # rest and peak frames of docs/reference/synchronization.mov disproves it:
      # neighbouring words are pixel-identical, so the line is static, and the
      # popped word's ink bottom stays on its baseline while it grows. At about
      # a third of the cap height, 0.25em read as a jump and buried the size
      # change that is the actual cue. The elevation is not lost -- scaling
      # about the glyph box's bottom (a descender below the baseline) raises the
      # word's TOP by ~0.15em on its own, which is what the diagram labels.
      sync_pop: 0.15
      # ------------------------------------------------------------------
      # 2.3 VOICE-SHAPED CREST. Every anchor is absolute; do not re-centre one
      # on the speaker's running median. The CSS animation returns all three
      # axes to normal at both endpoints.
      # ------------------------------------------------------------------
      # 2.3.6: the design system's authored range is 0.6x..2.4x around the 5%
      # baseline -- a FOUR-fold span between a whisper and a shout, and the
      # single most visible thing the design system does.
      #
      # OPENED UP 2026-08-01, [0.90, 1.20] -> [0.72, 1.62], at the user's
      # direction ("the reference has more feelings on motion"). The old band
      # was a 1.33x total span: about a twelfth of the specified excursion, so
      # a shout and a whisper rendered within a hair of each other and the
      # channel effectively did not exist. Look at frame 395 of
      # docs/reference/intonation.mov -- "louder" reaches roughly FOUR times the
      # text around it -- against our own stage, and the difference is the whole
      # complaint.
      # Composed with 2.2.3's independent 1.15 pop the largest crest is now
      # 1.86x, against 1.38x before.
      # WHY NOT THE FULL 0.6..2.4: rows here reserve each word's crest footprint
      # so a swelling word cannot collide with its neighbours, and that
      # reservation is paid for in base type size -- the row budget below had to
      # be re-fitted, and the caption dropped 45.3 -> ~35px at 1440x900. The
      # reference does not pay this: it re-fits the whole LINE while a word is
      # swelling, shrinking its neighbours to make room and restoring them
      # afterwards (visible across frames 350-440). Doing the same here would
      # buy the rest of the range back at full size; it is the next real step.
      voice_scale_range: [0.72, 1.62]
      # How much of the 2.3.6 excursion survives, applied ABOUT the baseline so
      # 2.3.5's anchor is exact at any value. This is the live narrowing lever,
      # and it is NOT the clamp: clamping alone flattens the top of the
      # distribution into one indistinguishable size, while this stays monotone.
      # 1.0 is the literal PDF range before the live clamp.
      # 0.25 kept 2.3.5's anchor exact while flattening everything around it;
      # 0.62 keeps the anchor and lets the distribution actually spread.
      voice_scale_response: 0.62
      # 2.3.8: 160-200 Hz is Regular 400 -- a BAND, not a pivot, so ordinary F0
      # jitter must not move the weight at all. 2.3.9: 80 Hz -> heavy,
      # 250 Hz -> light. The design system reaches 100..1000; live narrows it
      # for the same reason `expression.wght_range` does, because a voice at the
      # edge of the domain rendering hairline or black beside ordinary text is
      # legible in a poster and not in a live caption.
      weight_range: [200, 760]
      # 2.3.9/2.3.10: rich low harmonics read wider, thin high harmonics
      # condensed. Centred on 100% so the CONDENSED half is reachable -- the
      # previous mapping summed two always-positive terms and measured width
      # never once fell below 100%. Bounded well inside Roboto Flex's 25..151
      # wdth axis.
      width_range: [82, 124]

    # ENABLED FOR THE STUDIO 2026-08-01. This is the legacy renderer's flag and
    # stays false there. The Next studio implements the push in CSS instead
    # (`word-footprint` on `.word-sizer-crest`), because it is the motion the
    # reference is actually made of: watch the NEIGHBOURS in
    # docs/reference/intonation.mov frames 352->396 and the line re-flows around
    # "louder". Without it there is a pop and nothing else, which is exactly how
    # it read. The old objection -- "past written captions never move again" --
    # does not apply: the push is transient and symmetric in time, so a settled
    # row returns to precisely the geometry it had.
    neighbor_push: false      # legacy renderer only; the studio pushes in CSS
    # Open-caption adaptation: a word cannot be visible before ASR supplies it,
    # so its first paint is its visual activation. Run the same fixed §2.2.3
    # synchronization cue once when the DOM word is created. Later text,
    # verification, timing, and speaker revisions update that node in place
    # without replaying the cue.
    display_on_create: true
    # Optional per-character slide-in on a word's first paint. cc has NO such
    # effect — its read-ahead line simply appears white — so this is OFF for
    # cc parity: read-ahead words appear calm except for the one-time §2.2.3
    # real-time first-paint pop. Set true to re-enable the staggered entry.
    character_entry_enabled: false
    character_entry_duration_s: 0.24
    character_entry_stagger_s: 0.018
    character_entry_slide_em: 0.22
    character_entry_rise_em: 0.08
    character_entry_start_scale: 0.92
    character_entry_start_opacity: 0.0
    # Media-source seconds -> browser performance-time clock mapping. Small
    # arrival jitter is smoothed; a real discontinuity beyond the threshold
    # resets the anchor instead of slowly dragging motion back into sync.
    clock_smoothing: 0.18
    clock_reset_threshold_s: 0.75

# Live caption mode (`python -m autocwi live`): microphone -> true streaming
# language-specific ASR -> CWI-styled captions in the browser.
live:
  lang: en
  port: 7337
  # Language-independent acoustic delivery descriptors. These are observable
  # voice properties, not claims that a speaker is "angry", "happy", etc.
  # They are measured once from the word's first available audio span and then
  # frozen with that word, so a verifier/late speaker decision cannot replay or
  # reshape an already written caption.
  delivery:
    enabled: true
    frame_s: 0.064
    hop_s: 0.032
    context_s: 0.064
    pitch_confidence_min: 0.32
    # Contour is intentionally conservative. The old two-frame / 5-semitone
    # rule saturated ordinary connected speech and classified ~80% of sample
    # words as expressive. Praat must supply at least five trustworthy frames;
    # octave outliers are removed before the first/last robust medians.
    contour_full_scale_semitones: 7.0
    contour_min_voiced_frames: 5
    contour_min_voiced_fraction: 0.30
    contour_octave_filter_ratio: 1.60
    attack_full_scale_db: 12.0
    texture_brightness_hz: [700, 4200]
    realtime_smoothing: 0.28
    profile:
      min_confidence: 0.38
      contour_threshold: 0.45
      gentle_force_max: 0.18
      gentle_attack_max: 0.24
      # Absolute recording level alone cannot mean "gentle" (the entire Korean
      # fixture is quiet). Require a breathy/aperiodic texture too.
      gentle_texture_min: 0.60
      forceful_force_min: 0.75
      sustained_flow_min: 0.82
      sustained_duration_s: 0.44
      textured_min: 0.80
  # With no --lang override, the Next.js studio asks for this capture's
  # language before any recognizer loads or microphone/file capture starts.
  # Language is locked for the session so an in-flight decoder is never
  # relabelled while retaining the wrong acoustic state.
  languages:
    en:
      label: English
      native_label: English
      description: Nemotron streaming ASR with Parakeet endpoint verification
      model_label: 1120ms Nemotron accurate stream
    ko:
      label: Korean
      native_label: 한국어
      description: 6,500-hour Korean causal Zipformer
      model_label: Korean Zipformer 174M · 320ms
      streaming_model_dir: assets/streaming-zipformer-ko-174m
      # The 2026 174M stream is already the most accurate local recognizer in
      # the measured Korean A/B. The older 2024 stream scored 14.47% CER on the
      # bundled KSS clips; this profile scored 0%. Keep one authoritative
      # stream instead of showing the older model's errors as an early draft.
      draft_enabled: false
      # A separately tested 2024 endpoint verifier scored 1.32% CER, but
      # changed one phrase that this stream had already recognized correctly.
      # Do not let a weaker endpoint model overwrite the stronger live text.
      verifier_enabled: false
      decoding_method: greedy_search
      streaming_max_active_paths: 8
      streaming_files:
        tokens: tokens.txt
        encoder: encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx
        decoder: decoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx
        joiner: joiner-epoch-99-avg-1-chunk-16-left-128.int8.onnx
      # The TIMIT first-phone sidecar maps English phones to English letters.
      # Korean stays truly streaming through Zipformer's subword emissions,
      # without inventing Latin-prefix hints.
      onset_prefix:
        enabled: false
      # Korean uses the Chinese-English CAM++ encoder as Sortformer's quiet
      # speech fallback. On two held-out FLEURS Korean voices it was 2.8x
      # faster than the English ERes2Net model (32 ms vs 90 ms for a 3 s turn)
      # with the same 0.42 clean same-vs-cross cosine margin.
      diarization:
        model: assets/speaker-embedding-multilingual/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
      speaker_attribution:
        assignment_threshold: 0.42
        provisional_threshold: 0.30
        new_speaker_threshold: 0.27
        retain_threshold: 0.36
        switch_threshold: 0.42
        short_stable_threshold: 0.28
  # Fast model drives revisable white words; accurate model alone locks color
  # and writes durable events. Both run faster than real time on the target M1.
  draft_model_dir: assets/streaming-nemotron-en-160ms
  streaming_model_dir: assets/streaming-nemotron-en-1120ms
  verifier_model_dir: assets/parakeet-unified-en-offline
  verifier_model_type: nemo_transducer
  # A small phoneme CTC sidecar supplies a monotonic speculative prefix at the
  # start of a speech turn. A held "Hello" can therefore paint H -> He -> Hel
  # while the sound is still continuing. Nemotron and Parakeet remain
  # authoritative and revise that SAME `uN:w0` DOM node; the prefix is never
  # written to the durable transcript.
  #
  # English phones do not uniquely determine spelling ("phone", "hour",
  # "knife"), so extensions require repeat observations and stay provisional.
  onset_prefix:
    enabled: true
    model_dir: assets/phoneme-onset-en
    model_id: bihungba1101/wav2vec2-base-timit-phoneme-demo-google-colab
    hop_s: 0.08
    min_audio_s: 0.22
    synthetic_right_context_s: 0.24
    max_analysis_s: 3.00
    max_prefix_chars: 8
    prefix_stability_updates: 2
    sustain_update_s: 0.12
    min_confidence: 0.60
    activation_db: -50.0
    silence_db: -54.0
    reset_s: 0.45
  streaming_files:
    tokens: tokens.txt
    encoder: encoder.int8.onnx
    decoder: decoder.int8.onnx
    joiner: joiner.int8.onnx
  num_threads: 4
  verifier_num_threads: 4
  verifier_decoding_method: modified_beam_search
  verifier_max_active_paths: 4
  # A short synthetic tail lets the offline verifier flush its final acoustic
  # context without making the live endpoint wait longer. It prevents the
  # bundled sample's unstable "order" -> "artist" endpoint correction.
  verifier_tail_padding_s: 0.10
  # `local` = fully offline (default). `openai` opts the DURABLE TEXT LANE ONLY
  # into a cloud call at each endpoint; timing/prosody/diarization stay local
  # because OpenAI returns no word timestamps. The local verifier above runs
  # first and remains the fallback. Needs OPENAI_API_KEY + `pip install openai`.
  # UNMEASURED against local Parakeet — benchmark before demoing.
  verifier_backend: local
  openai_verifier:
    # Endpoint buffers are COMPLETE utterances, so the completed-audio model
    # applies; `gpt-live-transcribe` trades quality for streaming latency this
    # seam does not need.
    model: gpt-transcribe
    timeout_s: 2.0        # bounds the stall: transcribe() blocks the capture path
    min_duration_s: 0.4   # skip the round trip on fragments/false endpoints
    language: null        # null = session language
    prompt: ""            # optional keyword/context hint
    record_disagreements: true
  # Longer verifier phrases retain linguistic context. Stable streaming words
  # remain visible immediately; only the authoritative phrase lock waits.
  endpoint_silence_s: 1.2
  endpoint_max_s: 30.0
  # Cold-start window only (first 6 words); after that the mapping uses
  # percentiles of the speaker's own word history.
  db_range: [-45, -15]
  # Loudness normalization window, as percentiles of recent word dB. A fixed
  # `median - 5 dB` floor clipped 35% of ordinary words to whisper size —
  # real connected speech spans ~26 dB below its median. Widen the low
  # percentile if unstressed words still look too small.
  db_percentiles: [10, 95]  # [5,95] over-widened: loud words hit 9% and overflowed
  db_min_span: 18.0      # never stretch a monotone passage across the range
  # Local learned segmentation + speaker embeddings for live attribution.
  # pyannote segmentation 3.0 finds speech turns/overlap inside each endpoint;
  # one 3D-Speaker embedding per resulting turn maps it to stable S1/S2/... IDs.
  # Sequential non-overlapping voices also use non-overlapping embedding change
  # windows (a segmentation output stream may be reused after a speaker stops).
  # This is intentionally not sherpa's full-file wrapper: that delayed the
  # bundled clip ~25 s, while this targeted path stays well below real time.
  #
  # ERes2Net was chosen by an in-domain calibration on the bundled film clip,
  # not its name/size: meaningful same-speaker turn pairs measured ~0.39–0.61
  # cosine while cross-speaker pairs stayed <=0.27. ResNet293-LM, despite a
  # strong clean VoxCeleb score, overlapped badly on this quiet program audio.
  # ERes2Net is also small (25 MB) and averages ~60 ms per measured turn.
  diarization:
    enabled: true
    # auto = native Core ML Streaming Sortformer on Apple Silicon when its
    # one-time helper/model setup exists, otherwise the embedding tracker.
    # Use `live --diarizer embedding` for a deterministic comparison.
    backend: auto
    model: assets/speaker-embedding-en/3dspeaker_speech_eres2net_sv_en_voxceleb_16k.onnx
    segmentation_model: assets/speaker-segmentation-en/model.int8.onnx
    num_threads: 2
    segmentation_num_threads: 2
    # Used only if the learned segmentation model is missing.
    change_below: 0.25     # adjacent-window cosine below this = turn boundary
    max_speakers: 6        # CI main palette size (2.1.1)
    window_s: 1.0
    hop_s: 1.0             # non-overlap: do not smear both sides of a turn
    sortformer:
      executable: native/sortformer/.build/release/autocwi-sortformer
      cache_dir: assets/sortformer-coreml
      startup_timeout_s: 120
      # Require real overlap with the word; missed quiet speech falls back to
      # the endpoint embedding tracker rather than being forced onto a slot.
      min_word_coverage: 0.24
      # Bound endpoint synchronization. It does not accumulate: the native
      # model runs continuously and this only closes a small reader-thread race.
      endpoint_wait_ms: 90
  # Tunable engineering defaults, not scientifically validated constants.
  # Similarities/confidences are cosine values clamped to 0..1. Optional
  # overlap, signal-quality, and direction inputs are accepted by the manager;
  # the current mono capture path supplies neither overlap nor direction.
  speaker_attribution:
    min_enrollment_duration_s: 0.8  # clean speech required to create/update a profile
    min_assignment_duration_s: 0.25 # shorter spans stay unknown or continuity-only
    stable_after_observations: 2    # repeated clean observations make a profile stable
    # S1/S2 stay low latency. A third-or-later identity remains neutral until
    # repeated clean endpoint observations confirm it, preventing transient
    # native tracks or one noisy embedding from turning two people into five.
    immediate_speaker_limit: 2
    # Raw ERes2Net cosine similarities, not calibrated probabilities.
    assignment_threshold: 0.33      # confident match to an enrolled speaker
    provisional_threshold: 0.20     # short but well-separated matches may be tentative
    new_speaker_threshold: 0.30     # below this, a long clean span may enroll a voice
    centroid_ema_alpha: 0.15        # weight of a clean observation in centroid EMA
    switch_hysteresis_s: 0.35       # challenger persistence required before switching
    short_turn_max_duration_s: 1.1  # weak short turns prefer recent-speaker continuity
    retain_threshold: 0.32          # separate lower threshold for retaining current voice
    switch_threshold: 0.33          # separate higher threshold for switching voices
    min_confidence_margin: 0.08     # best-minus-second-best ambiguity guard
    # Clean short replies score below full-turn cosine thresholds even with a
    # good embedding model. Accept them as stable only when an already-stable
    # profile wins by a large margin; enrollment still uses the stricter values
    # above. Bundled-film calibration: "Look, just" S1=0.235/S2=0.010 and the
    # final reply S2=0.352/S1=0.186 after speech-tail timestamp recovery.
    short_stable_threshold: 0.18
    short_stable_min_margin: 0.12
    short_stable_max_duration_s: 1.3
    min_signal_quality: 0.25        # optional 0..1 update-quality floor
    direction_prior_weight: 0.05    # optional direction contribution (weak prior only)
    provisional_color_strength: 0.55 # speaker-color share in tentative word color
    debug: false                    # add decision details and print session metrics
  # Non-speech / paralinguistic sound tagging (CWI 2.x descriptors). A local
  # Zipformer AudioSet model tags the true-level audio; results are de-bounced
  # into one caption event per real sound and shown in a distinct non-speech
  # lane, never inline in the speech text. Model is a one-time ~50 MB download
  # (fetch_streaming_model.py); if absent, live mode continues without it.
  # AudioSet has 527 leaf classes — `categories` maps the ones that matter onto
  # four coarse buckets by case-insensitive substring; `suppress` drops the
  # Speech classes the recognizer already owns.
  sound_events:
    enabled: true
    model: assets/audio-tagging-en/model.int8.onnx
    labels: assets/audio-tagging-en/class_labels_indices.csv
    num_threads: 2
    top_k: 5
    window_s: 2.0            # trailing audio classified each hop
    hop_s: 0.5               # how often the tagger runs
    min_conf: 0.35           # prob needed to OPEN a segment (chip appears)
    end_conf: 0.20           # prob needed to sustain it (hysteresis < min_conf)
    hold_s: 0.6              # keep open this long after it drops (no strobing)
    min_gap_s: 0.8           # re-trigger guard per category
    suppress:                # AudioSet classes the ASR owns — never a chip
      - Speech
      - Conversation
      - Narration, monologue
      - Babbling
    categories:
      vocal:
        - Laughter
        - Giggle
        - Snicker
        - Chuckle, chortle
        - Baby laughter
        - Belly laugh
        - Sigh
        - Gasp
        - Cough
        - Throat clearing
        - Sneeze
        - Sniff
        - Breathing
        - Crying, sobbing
        - Whimper
        - Groan
        - Screaming
        - Whistling
      reaction:
        - Applause
        - Clapping
        - Cheering
        - Crowd
        - Booing
        - Chatter
        - Hubbub
      music:
        - Music
        - Musical instrument
        - Singing
        - Choir
        - Guitar
        - Piano
        - Drum
        - Trumpet
        - Violin
        - Song
      environmental:
        - Door
        - Knock
        - Doorbell
        - Telephone
        - Ringtone
        - Telephone bell ringing
        - Alarm
        - Siren
        - Vehicle horn
        - Car alarm
        - Dog
        - Bark
        - Bell
  # Quiet speech produced no captions at all because the streaming transducer
  # stops emitting non-blank tokens well below its training level. This gains
  # ONLY the recognizer's copy of the audio; prosody keeps measuring the true
  # captured level, so a whisper still renders small.
  input_gain:
    enabled: true
    target_dbfs: -26.0       # RMS the recognizer is driven toward
    min_gain_db: 0.0
    max_gain_db: 30.0
    initial_gain_db: 0.0
    floor_margin_db: 8.0     # speech must clear the noise floor by this much
    absolute_floor_db: -72.0 # below this the input counts as no signal
    floor_window_s: 6.0
    attack_db_per_s: 24.0    # shed gain fast so a loud passage cannot clip
    release_db_per_s: 6.0    # add gain slowly so the level does not pump
    acquire_db_per_s: 60.0   # first convergence, so the opening words survive
    headroom_dbfs: -1.0
    level_event_period_s: 0.12
  # Settings for the optional legacy `live --whisper MODEL` pause segmenter.
  # The streaming transducers do not use an energy gate; recognized quiet words
  # must not be discarded.
  silence_db: -42          # fallback threshold when adaptive is off / warming up
  adaptive_silence: true   # track the noise floor so music beds don't block cuts
  min_silence_s: 0.4
  min_speech_s: 0.25
  max_utterance_s: 4.0

# Closed-caption playback (`autocwi cc spec.json`). Text is known in advance
# here, so the FULL CWI motion system is possible — unlike live mode, which
# must approximate it. This is the reference implementation.
closed_caption:
  # CWI 2.2.1: a line is legible in white this long before its first word.
  read_ahead_s: 2.0
  line_hold_s: 1.2
  # How the colour turn crosses a word. `character` advances the boundary
  # through the letters over the word's own spoken span; `word` flips the
  # whole word at onset. The official AE template drives a WORD-index range
  # selector but with Ease High/Low set, which smooths the hand-off across
  # characters — word-level timing, character-level appearance.
  sync_granularity: character
  # The template's travelling wave. Off in live mode because displacing
  # settled text disturbs a reader mid-transcript; safe here, because a
  # closed caption plays through and is gone.
  neighbor_bleed: 0.34
  # The travelling character wave, read off the reference recordings: inside a
  # single word the letters sit at different heights and sizes as the spoken
  # boundary passes ("a-ni-mati-o").
  #
  # The website wave straddles the boundary: a letter crouches while it is
  # still white, crosses the baseline near its own colour turn, peaks above it
  # about 80 ms later, and then settles. Adjacent letters therefore occupy
  # visibly different phases without any opacity/typewriter reveal.
  #
  # Read straight out of `AE PROJECT/.../Academy_CI_Template.aep`, which is the
  # ORIGINAL SOURCE of this motion. It holds exactly four text animators and
  # between them they touch only `ADBE Text Position 3D` and
  # `ADBE Text Fill Color`:
  #
  #   Words       fill = yellow                (the settled state)
  #   Up          y = -5                       (lift)
  #   Yellow      y = -amp, fill = COLOR_01    (lift + the colour turn)
  #   Antecipate  y = +2, one frame earlier    (a small DOWNWARD dip)
  #
  # There is NO ADBE Text Scale / Tracking / Size / Rotation / Skew / Opacity
  # animator in the downloadable template — its calm motion is position and
  # colour. The website and PDF add the visible pop implemented below, while
  # word-wide size/weight intonation remains a separate prosody channel.
  #
  # "Yellow" drives the lift AND the fill from ONE range selector, so the rise
  # and the colour turn are exactly in phase — the letter is at the top of its
  # lift at the instant it turns, and comes back down behind the boundary.
  # That is the bounce. A lift that merely LEADS the colour and lands at rest
  # as it arrives is smooth but dead.
  #
  # The selector is Index units, Based On = Words, exactly one word wide
  # (Index End = start + 1), Ease High 50 / Ease Low 50 — a smoothstep pass.
  # `wave_reach` is the amplitude, 0..1; 0 is the calm film setting (colour
  # sweep only, every letter on one baseline). `wave_window_s` is how long the
  # pass takes over one letter, held in SECONDS so it travels at one rate
  # through a two-letter word and a nine-letter one.
  wave_reach: 1.0
  # FITTED TO THE THREE REFERENCE RECORDINGS in docs/. Individual glyphs were
  # tracked frame by frame across all three, each aligned on its OWN colour
  # turn (found from saturation: unspoken text is unsaturated white/grey), and
  # the curves averaged. What that shows, consistently in all three:
  #
  #     a letter sits ~10% of its height BELOW the baseline while still
  #     unspoken, rises THROUGH the baseline exactly as it turns, peaks ~10%
  #     above at +80 ms, and is settled by +240 ms -- with NO undershoot.
  #     Size holds at rest until the turn, then blooms to ~1.13 at +110 ms and
  #     is back by +280 ms.
  #
  # The crouch is the anticipation, and it is the .aep's two position animators
  # seen from the other end: "Antecipate" (y = +2, DOWNWARD, ahead of the turn)
  # handing off to "Up"/"Yellow" (y = -5). 10% of glyph height = 0.052 em.
  wave_crouch_em: 0.052       # how far BELOW the baseline before the turn
  wave_crouch_lead_s: 0.22    # when the crouch begins
  wave_release_s: 0.18        # peak -> rest; measured fall 160-190 ms
  # A word waits RAISED until it is spoken, however long that takes; this caps
  # it. Measured on "is" in "precisely as each word is spoken.": the speaker
  # pauses 1.47 s and "is" sits raised and white for ~0.75 s of that before
  # turning. A fixed anticipation window leaves it at rest through the pause.
  wave_hold_max_s: 0.90
  wave_peak_s: 0.08           # peak lands this long AFTER the colour turn
  # The template's +2 against its -(5 + amp): the dip is ~13% of the lift.
  anticipation_dip_em: 0.04

  # TWO COMPOSABLE SYSTEMS, not one generic text wave. They multiply:
  #   word-level scale x character-level scale + character-level lift
  #
  # 1. INTONATION — word level, UNIFORM across the word's letters. The word
  # begins to swell and thicken BEFORE it is spoken (it may still be white),
  # peaks near the stressed portion, holds briefly, then decays back to the
  # common resting typography. Size/weight are never sent through a word letter
  # by letter — only the synchronization wave travels. Amplitude comes from
  # prosody: a median word barely deforms, a loud one clearly swells. Nothing
  # is baked in; after the decay a word matches its neighbours exactly.
  emphasis_lead_s: 0.18       # 120-220 ms before the spoken onset
  # An unemphatic word is not an event: the below-baseline side of the
  # envelope is compressed so a quiet word barely deforms, while a loud one
  # swells freely. 1.0 = symmetric (a quiet word shrinks as much as a loud
  # word grows), 0 = quiet words never deform at all.
  # 1.0 = a quiet word shrinks by as much as the mapping says. Compressing this
  # (0.35) put the entire quiet side inside the deadband, so "softer." could
  # never render smaller than an ordinary word however quiet it was measured.
  quiet_deformation: 1.0
  # CWI reads as uniform type with only OCCASIONAL emphasis. Giving every
  # word an envelope means something is always moving, which is what reads
  # as noise. Words within this fraction of the resting size are pinned to
  # it exactly and never animate; only a genuine deviation swells.
  # Below the quiet side's reachable deviation, or quiet words are swallowed
  # whole. Safe to lower now that prosody is MEASURED rather than inferred:
  # ordinary words sit genuinely near the median and still fall inside it.
  emphasis_deadband: 0.05
  # Deriving WEIGHT from the recording: how far a word's ink density must
  # deviate from the line's median before it counts as emphasis at all, and the
  # deviation that maps to the full weight range. Absolute, not relative to the
  # phrase's own maximum -- normalising by that stretched the largest NOISE
  # deviation to full bold in phrases where nothing was emphasised. Measured:
  # "weights" +0.53, "louder" +0.19, everything else within +-0.09.
  weight_deadband: 0.12
  weight_full_dev: 0.55
  emphasis_hold_s: 0.08
  emphasis_tail_s: 0.30       # 200-400 ms after the peak
  # 2. SYNCHRONIZATION — character level, two ASYMMETRIC phases either side of
  # each letter's own colour turn:
  #   approach   (still white) rises and compresses very slightly, then lands
  #              as the colour arrives          -> wave_window_s, wave_dip
  #   overshoot  (now coloured) pops just past resting size and settles
  #                                             -> wave_settle_s, wave_pop
  # The pop must happen AFTER the letter is coloured, never while still white.
  # Only a few adjacent letters move at once.
  # Peak rise, reached only when a word has waited `wave_hold_full_s` to be
  # spoken. Measured: 77% of glyph height on "is" after a 1.47 s pause
  # (0.77 x 0.529 em); ordinary fast speech reaches `wave_hold_floor` of it,
  # ~14%, which is what the aggregate fit saw.
  wave_lift_em: 0.41
  wave_hold_floor: 0.18       # fraction of the rise a just-in-time word gets
  wave_hold_full_s: 0.70      # wait at which the rise is full
  # Per-character SCALE is off. Measured on the original, letters sit on one
  # baseline (median spread 1px = 2% of glyph height) and move once, purely
  # vertically, as the boundary passes. Giving each letter a lift AND a dip
  # AND a pop is three oscillations per letter at ~15 letters/sec, which is
  # what reads as vibrating. Size belongs to the word-level envelope; this
  # also matches the AE template, whose only per-character property is
  # Position 3D. Raise them to restore the spec's scale bounce.
  wave_dip: 0.0               # scale while approaching
  wave_pop: 0.132             # size bloom just after the turn
  pop_release_s: 0.29
  pop_peak_s: 0.11
  # ---------------------------------------------------------------------
  # 2.2.3 GUIDING THE EYE WITH MOTION. The design system states the whole
  # synchronization motion in one sentence, and it is per WORD, at the moment
  # that word changes colour:
  #
  #   "Caption with Intention adds a motion element to each word as it changes
  #    color. Each word should undergo a 15% increase in type size before
  #    returning to its original size, creating a 'pop' motion effect."
  #
  # ...with the accompanying diagram labelling the rise "25% elevation".
  #
  # This is a SYNCHRONIZATION cue and it is the SAME for every word, loud or
  # quiet: its job is to point the eye at the word being spoken. Per-word
  # amplitude belongs to the intonation channel (2.3.3-2.3.6), which is a
  # different scope and is driven by the measured prosody. Collapsing the two
  # is what produced motion that was large on words the reference leaves
  # still and absent on words it moves.
  #
  # 2.2.4 sets the scope: "In most cases, words will be spoken and animated
  # FULLY, ONE BY ONE" -- syllable-at-a-time is the documented exception, not
  # the default. So the pop and the elevation are word-level, never per letter.
  sync_pop: 0.15              # +15% type size at the turn, then back (2.2.3)
  # UNRESOLVED, and deliberately left as-is: live re-read "25% elevation" as 25%
  # of GLYPH HEIGHT (0.132 em) after measuring all three reference recordings,
  # where the median word travels ~25% of a glyph. `cc` still spends 0.25 em,
  # which is ~1.9x that. `cc` is the authored reference renderer and plays through
  # rather than accumulating, so a larger excursion is defensible there -- but if
  # the glyph-height reading is right, this is simply too big. Re-derive against
  # docs/reference before changing it.
  sync_elevation_em: 0.25     # 25% elevation at the turn, then back (2.2.3)
  # Shape only -- the design system gives the amplitudes, the recordings give
  # the timing of the same event (rise 70-100 ms, peak +70-100 ms past the
  # colour turn, fall 160-190 ms).
  sync_rise_s: 0.09
  sync_peak_s: 0.08
  sync_fall_s: 0.18
  # spec     - the model above, with per-word amplitude from measured prosody.
  # measured - replay each word's baked `motion` curves verbatim (a derived
  #            reference spec only). Useful for checking the derivation; the
  #            design system is what ships.
  motion_source: spec
  # Film reference: ONE tight centred line at a time, not a transcript.
  max_lines: 1
  # 0 = never break a line on WORD COUNT. A derived reference spec carries its
  # own `line_break` flags -- the grouping the recording actually shows -- and
  # `display.max_words: 8` was silently re-cutting it, splitting a 10-word
  # sentence in half.
  max_words: 0
  # The baked `motion.lift` channel is in GLYPH HEIGHTS, the unit the
  # recordings are measured in. This converts to em: Roboto Flex's cap height
  # is ~0.71 em and a mixed-case word's median ink height sits just under it.
  # Calibrate with scripts/compare_to_reference.py, never by eye.
  glyph_height_em: 0.70
  # Count style writes and visible-set flips per frame; window.__ccChurn
  # .report() prints them. Off by default -- it is an instrument, not a
  # feature, and flicker is measured with it rather than eyeballed.
  debug_churn: false
  # Horizontal tracking measured in docs/reference/character_identification.mov and docs/reference/intonation.mov: the caption
  # advances past a fixed playhead instead of remaining centred. Disabled for
  # ordinary CaptionSpecs; `cc --ref ...` enables it, while each derived word's
  # `tracking` flag keeps the Synchronization recording static inside demo.
  tracking:
    enabled: false
    playhead_pct: 50.0
    interp: monotone_cubic
    coast_s: 0.18
    handoff_s: 0.36
    catch_up_s: 0.20
    enter_offset_pct: 32.0
    exit_offset_pct: -32.0
  # Resting type size, % of frame height. CWI 2.3.5 baseline is 5%; the film
  # stills sit nearer 4% because the box hugs a single short line.
  # Axis overrides for `cc` only; live keeps `expression`'s calmer values,
  # because live accumulates words and a settled word must never restyle.
  # Measured on the reference recordings, "sizes," swells to 1.43x its own
  # resting height and "weights" thickens by 1.49x in ink density -- neither
  # fits through live's compression: `size_response: 0.42` caps the reachable
  # swell at 1.43 (so the measured value clamped) and `wght_range: [280,500]`
  # leaves only +70 weight units above the anchor, which is imperceptible.
  # Measured off the intonation recording at "louder": the word reaches 3.10x
  # the line's median glyph height and 2.54x its ink density. Live's
  # compression cannot express that -- `size_response: 0.42` caps the swell at
  # 1.43 and `wght_range: [280,500]` at 1.16x the anchor -- so `cc` runs the
  # axes uncompressed over the full CWI range.
  size_response: 1.0          # no compression; the reference uses the full range
  # 2.3.9 maps the whole Roboto Flex weight axis over the human vocal range:
  # 80 Hz -> 1000, 160-200 Hz -> Regular 400, 250 Hz and above -> 100. A
  # closed caption plays through and is gone, so `cc` can carry that range;
  # live cannot, because words accumulate and a settled word must not restyle.
  wght_range: [100, 1000]
  anchor_wght: [380, 420]     # 2.3.8: Regular 400 for a 160-200 Hz voice
  # 2.3.5: "The baseline type size for normal speaking volume is 5% of the
  # overall screen height." Earlier this sat at 2.8 to match the film stills;
  # the design system is explicit, so it wins.
  size_pct: 5.0

mapping:
  # Volume -> type size (2.3.3-2.3.6). Unit = % of video height.
  # Baseline (normal speech) 5%; whisper 3%; shout 12%. Driven by the
  # per-speaker-normalized loudness so each voice uses its own dynamic range.
  # 2.3.5 baseline 5%, 2.3.6 range 3% (whisper) .. 12% (shout). Stated
  # outright in the design system, so the reachable envelope is exactly
  # 0.6x .. 2.4x the resting size.
  loudness_to: { axis: size, min: 3, max: 12, baseline: 5, unit: pct_video_height }
  # Pitch -> weight (2.3.7-2.3.10). CWI maps ABSOLUTE Hz: 80 Hz -> heavy,
  # 160-200 Hz -> Regular 400, 250 Hz -> thin. domain_hz makes the renderer
  # use raw pitch_hz over this domain instead of the normalized value.
  # invert: true = higher pitch, lighter type (the CWI convention).
  pitch_to: { axis: wght, min: 100, max: 1000, invert: true, domain_hz: [80, 250] }
  # CWI 2.3.7-2.3.10 pairs the weight response with the Roboto Flex width
  # axis: lower/fuller voices expand; higher/thinner voices condense. In live
  # mode pitch is the available local proxy for harmonic distribution.
  harmonics_to: { axis: wdth, min: 25, max: 150, invert: true, domain_hz: [80, 250] }
  speaker_to: color

# How much of each measured per-word deviation actually reaches the type.
#
# CWI's absolute anchors (3/5/12%, wght 1000..100) describe DELIBERATE dynamics
# — a whisper, a shout, one character against another. Applied raw to per-word
# acoustics of a single speaker they mistake the natural amplitude envelope of
# connected speech for intent: measured on one calm sentence, type size swung
# 3.2x (unstressed "would"/"and" rendered as whispers at 3%, "early" near a
# shout at 9.7%) and unvoiced words snapped from wght 958 to 400 mid-line.
#
# `response` is the fraction of each deviation from the speaker's own baseline
# that survives. 1.0 restores the raw absolute mapping; lower values keep the
# direction of the expression while removing the fabricated dynamics.
expression:
  # The film reference reads as a normal-weight sans with uniform colour and
  # only occasional emphasis. Weight/width deviations are compressed hard so
  # ordinary speech rests at one weight; a genuinely extreme voice still
  # reaches the ends of the CWI range.
  size_response: 0.42
  weight_response: 0.16
  width_response: 0.16
  # Running window of recent voiced words defining "normal for this speaker".
  baseline_words: 12
  # Typography eases between words instead of snapping (2.2.3 is continuous
  # motion; nothing in CWI cuts).
  transition_ms: 190

  # The axes are CUMULATIVE. Resolving each word from its own measurement alone
  # made the type re-decide on every word and never settle, which reads as
  # flicker no matter how far the deviations are compressed.
  #
  # `smoothing_words` is the running MEDIAN window. A median, not an average:
  # an average lets one emphatic word drag the value up and then decay slowly,
  # so a single loud word resized the following half-dozen. A median ignores an
  # isolated outlier outright and still follows a sustained change.
  #
  # The steps then hold that running value at a discrete level until it crosses
  # a boundary by more than `hysteresis` of the gap — without that margin a
  # value resting near a boundary oscillates between two levels on consecutive
  # words. Levels move one at a time, so change is always gradual.
  #
  # Hand-authored CWI sits at a level through a passage and moves when the
  # delivery moves; it does not modulate continuously word by word.
  smoothing_words: 5
  # Live legibility clamp on the speaker's RESTING anchors (a documented
  # deviation from CWI's absolute Hz anchors): a deep film voice anchored the
  # entire transcript at wght ~900 / wdth ~137 — a wall of black extended
  # type (verified by screenshot). Deviations still reach the full range.
  anchor_wght: [340, 430]
  # Hard bounds on the RENDERED axes. Without these a voice at the edge of the
  # pitch domain rendered at wght 100 (hairline) or 1000 (black) next to
  # ordinary text — legible in a poster, not in a live caption.
  wght_range: [280, 500]
  wdth_range: [85, 115]
  anchor_wdth: [88, 112]
  hysteresis: 0.35
  # Live ladder. CWI's 9%/12% are cinematic shout sizes; on a live transcript
  # stage they overflowed the frame and read as chaos (verified by
  # screenshot), so ordinary speech resolves in a tight 4-6.5% band and 9% is
  # reserved as the genuine-shout extreme.
  size_steps: [2.6, 3.1, 3.6, 4.4, 6]
  weight_step: 100
  width_step: 25

normalization:
  # Per-speaker percentile range mapped to 0..1 (robust to outliers).
  low_percentile: 5
  high_percentile: 95
  # Words below this hold the speaker's baseline weight rather than snapping to
  # Regular 400: for a deep voice whose baseline is already heavy, dropping an
  # unvoiced word to 400 reads as a different speaker, not a quieter one.
  min_voiced_frac: 0.2

# Haptic salience, grounded in DHH haptics research (Haptic-Captioning
# CHI'23; Tactile Emotions CHI'25): continuous vibration is distracting, so
# durable word events flag only what is worth actuating — speaker changes and
# strongly emphasized words — with the threshold exposed for per-user tuning.
haptics:
  emphasis_db: 6.0    # word this far above the speaker's median dB = emphatic

asr:
  model: small          # base | small | medium
  beam_size: 5
  temperature: 0.0      # deterministic decoding

diarization:
  model: pyannote/speaker-diarization-3.1

prosody:
  pitch_floor_hz: 75
  pitch_ceiling_hz: 500

render:
  font_path: assets/RobotoFlex.ttf   # fetched by scripts/fetch_font.py
  korean_font_path: assets/NotoSansKR.ttf

seed: 42
