name: Caption or motion is wrong
description: A word is clipped, mis-coloured, re-animates, or moves unlike the design system
labels: ["captions"]
body:
  - type: markdown
    attributes:
      value: |
        Typography and motion bugs are **visual**. Numeric probes have called a
        broken layout "probably fine" more than once, so a screenshot is
        required here.

  - type: textarea
    id: what
    attributes:
      label: What the caption did
      description: >
        Which word or row, and what was wrong with it. If it is about *which*
        word is emphasised, note that emphasis is derived from the audio and
        is not fitted to any reference clip.
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or screen recording
      description: Drag the file in. A recording is better for anything that moves.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command line, and any `config.yaml` values you changed.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Which channel
      multiple: true
      options:
        - colour (speaker attribution)
        - size / pop
        - lift
        - weight
        - width
        - the colour turn's timing
        - row layout, wrapping or clipping
        - read-ahead (words appearing too late or too early)
    validations:
      required: true

  - type: dropdown
    id: motion
    attributes:
      label: Motion system
      description: Enhanced is the default; legacy is one toggle away in Settings.
      options:
        - enhanced (default)
        - legacy
        - both
        - not sure
    validations:
      required: true

  - type: dropdown
    id: lang
    attributes:
      label: Language profile
      options:
        - en
        - ko
        - multi
    validations:
      required: true

  - type: textarea
    id: probe
    attributes:
      label: Probe output
      description: >
        Optional — the probes are development tooling and are not distributed
        with the project. If you have them: `clip_probe.py`, `speaker_probe.py`,
        `ink_collision.py`, `baseline_probe.py`, `word_remotion.py`,
        `motion_diff.py`. Include the `--broken` negative control run too: a
        check that has never been seen to fail is not evidence.
      render: shell

  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
